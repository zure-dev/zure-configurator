name = "Zure Configurator"
client_id = ""
application_url = "https://zure-configurator-widget.vercel.app"
embedded = true
handle = "zure-configurator"

[build]
automatically_update_urls_on_dev = true

[access_scopes]
scopes = "read_products,write_products,read_orders,write_orders,read_customers"

[auth]
redirect_urls = [
  "https://zure-configurator-widget.vercel.app/api/auth/callback"
]

[webhooks]
api_version = "2024-10"

[[webhooks.subscriptions]]
topics = ["products/update", "products/delete", "orders/create", "app/uninstalled"]
uri = "/api/webhooks"

[pos]
embedded = false